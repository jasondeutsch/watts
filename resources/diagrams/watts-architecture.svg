<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Watts — define, execute, measure, compare, revise</title>
<desc id="desc">A team-owned Watts package defines a versioned process. Pinned executions run agents, checks and approvals, preserving attempt evidence. Evals compare outcomes and resource use and guide package revisions. Temporal and workers support execution. Generic local container workloads are implemented; complete usage accounting and distributed artifact transport remain proposed.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4f46e5"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:21px;font-weight:700}.body{font-size:17px;fill:#475569}.small{font-size:14px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:1.5}.arrow{fill:none;stroke:#4f46e5;stroke-width:2.5;marker-end:url(#arrow)}.future{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5;stroke-dasharray:6 4}</style>
</defs>
<rect width="1200" height="680" rx="18" fill="#f8fafc"/>
<text x="40" y="52" font-size="32" font-weight="700">Watts</text>
<text x="40" y="89" font-size="23">Make the process explicit. Improve it with evidence.</text>
<text x="40" y="120" class="body">A repeatable team workflow — defined, versioned, executed, and evaluated.</text>

<rect x="40" y="167" width="255" height="215" rx="12" class="box"/>
<text x="60" y="200" class="small">DEFINE</text>
<text x="60" y="231" class="title">Watts package</text>
<text x="60" y="267" class="body">ACL · variables · modules</text>
<text x="60" y="297" class="body">Agents · tools · skills</text>
<text x="60" y="327" class="body">Checks · approvals · routing</text>
<text x="60" y="360" class="small">Review and version the process</text>
<path d="M295 275 H319" class="arrow"/>

<rect x="330" y="167" width="255" height="215" rx="12" class="box"/>
<text x="350" y="200" class="small">EXECUTE</text>
<text x="350" y="231" class="title">Pinned execution</text>
<text x="350" y="267" class="body">Run the selected configuration</text>
<text x="350" y="297" class="body">Agents and deterministic work</text>
<text x="350" y="327" class="body">Human decisions · rework</text>
<text x="350" y="360" class="small">Retain every attempt</text>
<path d="M585 275 H609" class="arrow"/>

<rect x="620" y="167" width="255" height="215" rx="12" class="box"/>
<text x="640" y="200" class="small">MEASURE</text>
<text x="640" y="231" class="title">Execution evidence</text>
<text x="640" y="267" class="body">Outputs · checks · findings</text>
<text x="640" y="297" class="body">Failures · retries · timing</text>
<text x="640" y="327" class="body">Link results to configuration</text>
<text x="640" y="360" class="small">Unknown metrics stay unknown</text>
<path d="M875 275 H899" class="arrow"/>

<rect x="910" y="167" width="250" height="215" rx="12" class="box"/>
<text x="930" y="200" class="small">COMPARE</text>
<text x="930" y="231" class="title">Workflow evals</text>
<text x="930" y="267" class="body">Comparable task cases</text>
<text x="930" y="297" class="body">Verification and review</text>
<text x="930" y="327" class="body">Outcomes vs. resource use</text>
<text x="930" y="360" class="small">Identify what needs to change</text>

<path d="M1035 382 V428 H167 V382" class="arrow"/>
<rect x="380" y="411" width="435" height="34" rx="8" fill="#f8fafc"/>
<text x="398" y="434" font-size="17" font-weight="700" fill="#4f46e5">REVISE · change the process, then evaluate again</text>

<rect x="40" y="477" width="550" height="112" rx="12" class="box"/>
<text x="60" y="509" class="title">Execution infrastructure</text>
<text x="60" y="542" class="body">Temporal: durable routing, waits, and workflow history</text>
<text x="60" y="569" class="body">Watts workers: execute stages and validate results</text>

<rect x="620" y="477" width="540" height="112" rx="12" class="future"/>
<text x="640" y="509" class="title">Proposed capabilities</text>
<text x="640" y="542" class="body">Complete accounting · distributed execution</text>
<text x="640" y="569" class="body">Hardened isolation · remote module registries</text>

<text x="40" y="631" class="small">0.1.0 proof of concept · generic OCI workloads · Pi/Ralph example image · eval scaffold available</text>
<text x="40" y="655" class="small">Declarative configuration makes decisions visible; it does not guarantee identical outputs or better outcomes.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">Watts — proposed architecture</title>
  <desc id="desc">Teams author workflows and resources. Watts compiles and applies an immutable plan containing routing and portable stage packages. Temporal coordinates isolated executors across nodes. Build, lint, and review exchange published artifacts through durable storage; review findings route back to build. CLI, web UI, and coordinators provide control and visibility. Compilation and distributed execution are proposed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033} .heading{font-size:19px;font-weight:700} .body{font-size:16px;fill:#475569} .small{font-size:14px;fill:#475569} .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)} .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5} .future{stroke:#6366f1;stroke-dasharray:7 5} .label{font-size:14px;fill:#4f46e5;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="730" rx="18" fill="#f8fafc"/>
  <text x="40" y="48" font-size="29" font-weight="700">Watts</text>
  <text x="154" y="47" font-size="20" fill="#475569">Declarative agent workflows · portable stages · explicit evidence</text>
  <text x="40" y="78" class="small">Forward-looking architecture · dashed outlines show proposed capabilities</text>

  <rect x="40" y="110" width="245" height="180" rx="12" class="box"/>
  <text x="60" y="143" class="heading">Team-owned definition</text>
  <text x="60" y="178" class="body">workflow.yaml + watts.yaml</text>
  <text x="60" y="208" class="body">Instructions · skills · scripts</text>
  <text x="60" y="238" class="body">Models · MCP connections</text>
  <text x="60" y="270" class="small">Authoring inputs, not live run state</text>

  <path d="M285 200 H330" class="line"/>
  <rect x="340" y="110" width="250" height="180" rx="12" class="box future"/>
  <text x="360" y="143" class="heading">Watts compile / apply</text>
  <text x="360" y="178" class="body">Validate and resolve</text>
  <text x="360" y="208" class="body">Package stage resources</text>
  <text x="360" y="238" class="body">Persist immutable plan</text>
  <text x="360" y="270" class="small">Apply starts an execution</text>

  <path d="M590 200 H635" class="line"/>
  <rect x="645" y="110" width="260" height="180" rx="12" class="box future"/>
  <text x="665" y="143" class="heading">Compiled execution plan</text>
  <text x="665" y="178" class="body">Orchestration manifest</text>
  <text x="665" y="202" class="small">Graph · bindings · outcomes · limits</text>
  <text x="665" y="238" class="body">Self-contained stage packages</text>
  <text x="665" y="262" class="small">Manifests + executable resources</text>

  <rect x="950" y="110" width="210" height="180" rx="12" class="box"/>
  <text x="970" y="143" class="heading">Control &amp; visibility</text>
  <text x="970" y="178" class="body">CLI · web UI</text>
  <text x="970" y="208" class="body">Human decisions</text>
  <text x="970" y="238" class="body">Coordinating agents</text>
  <text x="970" y="270" class="small">Status · output · retry</text>

  <path d="M775 290 V322 H295 V350" class="line"/>
  <path d="M1055 290 V332 H315 V350" class="line"/>
  <rect x="40" y="360" width="320" height="180" rx="12" class="box"/>
  <text x="60" y="395" class="heading">Temporal + Watts interpreter</text>
  <text x="60" y="430" class="body">Schedule attempts and route outcomes</text>
  <text x="60" y="460" class="body">Approval / event waits · retry budgets</text>
  <text x="60" y="490" class="body">Durable history · cancellation</text>
  <text x="60" y="521" class="small">Runs the plan; does not execute agents</text>

  <path d="M360 430 H405" class="line"/>
  <text x="375" y="411" class="small">dispatch</text>
  <rect x="420" y="360" width="740" height="180" rx="12" class="box future"/>
  <text x="440" y="393" class="heading">Watts workers + executor adapters</text>
  <text x="440" y="419" class="small">Materialize inputs → run isolated attempt → publish outputs → return result</text>
  <rect x="440" y="442" width="205" height="77" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="455" y="470" class="heading">Build · node A</text>
  <text x="455" y="490" class="small">Agent runtime</text>
  <text x="455" y="510" class="small">Writable workspace</text>
  <rect x="680" y="442" width="205" height="77" rx="9" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="695" y="470" class="heading">Lint · node B</text>
  <text x="695" y="490" class="small">Script runtime</text>
  <text x="695" y="510" class="small">Read-only source</text>
  <rect x="920" y="442" width="220" height="77" rx="9" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="935" y="470" class="heading">Review · node C</text>
  <text x="935" y="490" class="small">Agent runtime</text>
  <text x="935" y="510" class="small">Read-only source</text>

  <path d="M645 480 H672" class="line"/>
  <path d="M885 480 H912" class="line"/>
  <path d="M1030 519 V552 H542 V519" class="line"/>
  <text x="630" y="576" class="small">Changes required → build (routed by interpreter)</text>
  <path d="M1150 540 V585" class="line"/>
  <rect x="420" y="595" width="740" height="94" rx="12" class="box future"/>
  <text x="440" y="626" class="heading">Durable packages, workspace revisions &amp; attempt evidence</text>
  <text x="440" y="652" class="body">Explicit artifact transfer · hashes · immutable results · logs · review findings</text>
  <text x="440" y="677" class="small">Publish accepted changes back to the user’s project through an explicit operation</text>
  <text x="40" y="616" class="label">No shared filesystem assumed</text>
  <text x="40" y="643" class="small">Credentials are injected at launch.</text>
  <text x="40" y="668" class="small">Stages can run on distinct nodes.</text>
  <text x="40" y="693" class="small">Container / sandbox boundary per attempt.</text>
</svg>

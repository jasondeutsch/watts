agents:
    build:
        config_ref: agent-defaults
        container:
            command:
                - node
                - /opt/watts/launcher.mjs
            cpus: 2
            files:
                launcher.json: '{"outputs":["STORY_LOG.md"],"ralph":true}'
                ralph.md: |
                    ---
                    max_iterations: 10
                    timeout: 900
                    completion_promise: DONE
                    completion_gate: required
                    stop_on_error: true
                    commands:
                      - name: completion
                        run: node /inputs/resources/team/scripts/check.mjs stories /runtime/task
                        acceptance: true
                    ---
                    Implement PLAN.md stories in /workspace. Read /runtime/task/SPEC.md and PLAN.md. Run the quality gates from /workspace. Append DONE US-### to /runtime/task/STORY_LOG.md only after tests and lint pass. Address previous workflow feedback. Stop with <promise>DONE</promise> when all stories are done.

                    Use the declared command tools for quality checks; do not install or substitute verification tools. The executor runs required gates against the final candidate. Put build products and caches under /runtime.
            image: watts/go-generalist:0.1.0
            memory_mb: 4096
            network: bridge
            resources:
                team: '{package}'
            workspace: write
        environment:
            GOCACHE: /runtime/go-cache
            GOMODCACHE: /runtime/go-mod
        gate_policy:
            max_repairs: 2
        gates:
            - expect:
                exit_code: 0
              name: build-passes
              tool: build
            - expect:
                exit_code: 0
              name: test-passes
              tool: test
            - expect:
                exit_code: 0
              name: vet-passes
              tool: vet
            - expect:
                exit_code: 0
              name: lint-passes
              tool: lint
            - expect:
                exit_code: 0
              name: stories-complete
              tool: check-stories
        identity: watts-agent
        inputs:
            - SPEC.md
            - PLAN.md
        mcp_servers:
            gopls:
                args:
                    - mcp
                command: gopls
                cwd: .
        outputs:
            - STORY_LOG.md
        prompt: /ralph --path /runtime/task
        skills:
            - name: watts-guidance
              source:
                image_path: /opt/watts/kit/skills
            - name: go-team-guidance
              source:
                path: skills
                resource: team
        tools:
            - command:
                argv:
                    - bash
                    - /inputs/resources/team/scripts/build.sh
                timeout_seconds: 300
                working_dir: /workspace
              description: Compile the project into private runtime storage.
              name: build
            - command:
                argv:
                    - /usr/local/go/bin/go
                    - test
                    - ./...
                timeout_seconds: 300
                working_dir: /workspace
              description: Run the project Go tests.
              name: test
            - command:
                argv:
                    - /usr/local/go/bin/go
                    - vet
                    - ./...
                timeout_seconds: 300
                working_dir: /workspace
              description: Run Go vet static analysis.
              name: vet
            - command:
                argv:
                    - bash
                    - /inputs/resources/team/scripts/lint.sh
                timeout_seconds: 300
                working_dir: /workspace
              description: Check the project against team lint policy.
              name: lint
            - mcp:
                ref: gopls
              name: code-intelligence
            - command:
                argv:
                    - node
                    - /inputs/resources/team/scripts/check.mjs
                    - stories
                    - /runtime/task
                timeout_seconds: 30
                working_dir: /runtime/task
              description: Validate the task stories artifact.
              name: check-stories
    planning:
        config_ref: agent-defaults
        container:
            command:
                - node
                - /opt/watts/launcher.mjs
            cpus: 2
            files:
                launcher.json: '{"outputs":["PLAN.md"]}'
            image: watts/go-generalist:0.1.0
            memory_mb: 4096
            network: bridge
            resources:
                team: '{package}'
            workspace: read-only
        environment:
            GOCACHE: /runtime/go-cache
            GOMODCACHE: /runtime/go-mod
        gates:
            - expect:
                exit_code: 0
              name: plan-valid
              tool: check-plan
        identity: watts-agent
        inputs:
            - SPEC.md
        outputs:
            - PLAN.md
        prompt: 'The preceding workflow gate approved the specification. Read /runtime/task/SPEC.md. Use the plan-template skill to write /runtime/task/PLAN.md with real quality gates and sequenced stories. Incorporate previous review feedback. Do not implement code or approve documents. The application workspace is the current working directory supplied by Watts; the package descriptor may live elsewhere. Implement application source, tests, modules, and other project files in the project root and its normal source directories. The task directory holds workflow documents, story logs, review artifacts, and execution evidence only; do not create application code or a separate application module inside it. Quality gates run from the project root, not with a task-directory working directory. Describe the build Agent''s declared tools and gates in PLAN.md: `bash /inputs/resources/team/scripts/build.sh`, `go test ./...`, `go vet ./...`, and `bash /inputs/resources/team/scripts/lint.sh`. These run inside the build Agent; do not add a separate lint stage or install replacement tools. Lint findings must be fixed without weakening the lint configuration.'
        skills:
            - name: watts-guidance
              source:
                image_path: /opt/watts/kit/skills
            - name: go-team-guidance
              source:
                path: skills
                resource: team
        tools:
            - command:
                argv:
                    - node
                    - /inputs/resources/team/scripts/check.mjs
                    - plan
                    - /runtime/task
                timeout_seconds: 30
                working_dir: /runtime/task
              description: Validate the task plan artifact.
              name: check-plan
    review:
        config_ref: agent-defaults
        container:
            command:
                - node
                - /opt/watts/launcher.mjs
            cpus: 2
            files:
                launcher.json: '{"outputs":["review/VERDICT.md"],"ralph":true,"verdict":"review/VERDICT.md"}'
                ralph.md: |
                    ---
                    max_iterations: 10
                    timeout: 900
                    completion_promise: REVIEWED
                    completion_gate: required
                    stop_on_error: true
                    commands:
                      - name: completion
                        run: node /inputs/resources/team/scripts/check.mjs verdict /runtime/task
                        acceptance: true
                    ---
                    Review /workspace against SPEC.md and PLAN.md in /runtime/task. Run the quality gates. Do not change the application. Write /runtime/task/review/VERDICT.md with specific findings and a final line VERDICT: PASS or VERDICT: REJECT. Stop with <promise>REVIEWED</promise> after writing the verdict.

                    Use the declared command tools for quality checks; do not install or substitute verification tools. The executor runs required gates against the final candidate. Put build products and caches under /runtime.
            image: watts/go-generalist:0.1.0
            memory_mb: 4096
            network: bridge
            resources:
                team: '{package}'
            workspace: read-only
        environment:
            GOCACHE: /runtime/go-cache
            GOMODCACHE: /runtime/go-mod
        gate_policy:
            max_repairs: 0
        gates:
            - expect:
                exit_code: 0
              name: verdict-valid
              tool: verify-verdict
        identity: watts-reviewer
        inputs:
            - SPEC.md
            - PLAN.md
            - STORY_LOG.md
        outputs:
            - review/VERDICT.md
        prompt: /ralph --path /runtime/task
        skills:
            - name: watts-guidance
              source:
                image_path: /opt/watts/kit/skills
            - name: go-team-guidance
              source:
                path: skills
                resource: team
        tools:
            - command:
                argv:
                    - /usr/local/go/bin/go
                    - test
                    - ./...
                timeout_seconds: 300
                working_dir: /workspace
              description: Run the project Go tests.
              name: test
            - command:
                argv:
                    - /usr/local/go/bin/go
                    - vet
                    - ./...
                timeout_seconds: 300
                working_dir: /workspace
              description: Run Go vet static analysis.
              name: vet
            - command:
                argv:
                    - bash
                    - /inputs/resources/team/scripts/lint.sh
                timeout_seconds: 300
                working_dir: /workspace
              description: Check the project against team lint policy.
              name: lint
            - command:
                argv:
                    - node
                    - /inputs/resources/team/scripts/check.mjs
                    - verdict
                    - /runtime/task
                timeout_seconds: 30
                working_dir: /runtime/task
              description: Validate the review verdict artifact; PASS and REJECT are both valid decisions.
              name: verify-verdict
    specification:
        config_ref: agent-defaults
        container:
            command:
                - node
                - /opt/watts/launcher.mjs
            cpus: 2
            files:
                launcher.json: '{"outputs":["SPEC.md"]}'
            image: watts/go-generalist:0.1.0
            memory_mb: 4096
            network: bridge
            resources:
                team: '{package}'
            workspace: read-only
        environment:
            GOCACHE: /runtime/go-cache
            GOMODCACHE: /runtime/go-mod
        gates:
            - expect:
                exit_code: 0
              name: spec-valid
              tool: check-spec
        identity: watts-agent
        inputs:
            - SPEC.md
        outputs:
            - SPEC.md
        prompt: Read the human's request in /runtime/task/SPEC.md; it may be rough notes rather than a complete draft. Use the spec-template skill to investigate the project and draft or refine /runtime/task/SPEC.md. Preserve existing human intent, constraints, and substantive content; never overwrite it with a blank template. Record unresolved questions rather than inventing requirements. Incorporate previous review feedback. Write the updated SPEC.md to disk. Do not implement code or approve documents. The application workspace is the current working directory supplied by Watts; the package descriptor may live elsewhere. Implement application source, tests, modules, and other project files in the project root and its normal source directories. The task directory holds workflow documents, story logs, review artifacts, and execution evidence only; do not create application code or a separate application module inside it. Quality gates run from the project root, not with a task-directory working directory.
        skills:
            - name: watts-guidance
              source:
                image_path: /opt/watts/kit/skills
            - name: go-team-guidance
              source:
                path: skills
                resource: team
        tools:
            - command:
                argv:
                    - node
                    - /inputs/resources/team/scripts/check.mjs
                    - spec
                    - /runtime/task
                timeout_seconds: 30
                working_dir: /runtime/task
              description: Validate the task spec artifact.
              name: check-spec
config_maps:
    agent-defaults:
        data:
            api: openai-completions
            auth:
                env: OPENROUTER_API_KEY
                secret:
                    key: api-key
                    name: model-credentials
            base_url: https://openrouter.ai/api/v1
            model: deepseek/deepseek-v4-flash
            provider: openrouter
            thinking: medium
procedures:
    plan-review:
        execution:
            type: approval
        inputs:
            - SPEC.md
            - PLAN.md
    spec-review:
        execution:
            type: approval
        inputs:
            - SPEC.md
secrets:
    model-credentials:
        env:
            api-key: OPENROUTER_API_KEY
workflow:
    name: go-generalist
    spec:
        steps:
            - name: specification
              use:
                kind: Agent
                name: specification
            - name: spec-review
              transitions:
                approved: planning
                rejected: specification
              use:
                kind: Procedure
                name: spec-review
            - name: planning
              use:
                kind: Agent
                name: planning
            - name: plan-review
              transitions:
                approved: build
                rejected: planning
              use:
                kind: Procedure
                name: plan-review
            - name: build
              use:
                kind: Agent
                name: build
            - name: review
              transitions:
                changes-required: build
                success: end
              use:
                kind: Agent
                name: review
        templates:
            .gitignore: |
                .watts-state/
            PLAN.md: |
                # PLAN: <name>

                Task documents: tasks/<date>-<slug>/
                Implementation root: the application workspace selected at task creation

                Application source, tests, dependencies, and build files belong in the project root and its normal source directories. The task directory stores workflow documents and evidence only. Do not create a separate application or module under the task directory.
                Spec ref: SPEC.md v<N>
                Risk tier at Planning: <0 / 1 / 2, from SPEC.md>

                *The planning agent drafts this file. The plan-review workflow gate records human approval before implementation starts.*

                ## Architecture and approach

                What's the actual technical approach. Which existing components this extends versus touches versus leaves alone. Specific enough that two engineers reading this would build the same thing.

                -

                ## Data model and interface changes

                Concrete types, schemas, API contracts, or interfaces that change. Write "none" explicitly if purely internal, don't leave it blank.

                -

                ## Systems touched

                Cross-checked against the risk-tiering skill, not from memory.

                - Touches:
                - Does not touch:

                ## Technical decisions and alternatives considered

                What got chosen, what got rejected, and why. Not allowed to collapse silently for anything above Tier 0.

                -

                ## Testing strategy

                What gets covered by unit tests, what by integration tests, what's explicitly left untested and why that's acceptable here.

                -

                ## Observability

                What gets logged, measured, or alerted once this ships. How will anyone know it's working, how will anyone know it broke.

                -

                ## Security and privacy considerations

                Data handled, auth or access implications, anything that needs review beyond what the risk tier alone captures.

                -

                ## Performance considerations

                Expected load, any latency or memory budget, what happens under failure or at the edge of that budget.

                -

                ## Risk tier recheck

                Run the risk-tiering skill again against what this plan actually describes, not what SPEC.md assumed before the technical approach was known.

                Risk tier after planning: <0 / 1 / 2>
                Changed from Planning and Requirements: <yes, no>
                If yes, why:

                ## Rollback and migration

                How this gets undone if it's wrong. Required above Tier 0.

                -

                ## Dependencies and sequencing

                What this blocks on, what blocks on this, whether the order conflicts with other work already in flight.

                -

                ## Quality gates

                Commands every story must pass before it counts as done, one backticked command per bullet. Real commands for this repository, run from the repository root, not placeholders. The builder runs them, and the reviewer and the Watts checks run them again independently.

                - `bash /inputs/resources/team/scripts/build.sh`
                - `bash /inputs/resources/team/scripts/lint.sh`
                - `go test ./...`

                ## User stories

                *The build loop works through these in order. Keep the heading format exactly (`### US-001: Title`). Each story must be small enough for one agent iteration, with checkable acceptance criteria, a `Covers:` line naming SPEC criteria, and a `Depends on:` line. Every SPEC criterion must be covered by some story. Put the riskiest or approach-proving story first.*

                ### US-001: <short title>

                Covers: AC-1
                Depends on: none

                **As a** <user type>
                **I want** <capability>
                **So that** <benefit>

                #### Acceptance Criteria
                - [ ] <checkable criterion>
                - [ ] <checkable criterion>

                ### US-002: <short title>

                Covers: AC-2
                Depends on: US-001

                **As a** <user type>
                **I want** <capability>
                **So that** <benefit>

                #### Acceptance Criteria
                - [ ] <checkable criterion>

                ## Open questions for the author agent

                Anything ambiguous enough to come back as a question rather than get resolved by the agent's own judgment. Answer these here, before Development starts, don't let them surface for the first time as a rejection.

                -

                ## Review

                An agent drafts this document. The human approves or rejects it at the plan-review workflow gate with `wctl task decide <task> plan-review`, optionally using `--reject --feedback 'changes needed'`.
            SPEC.md: |
                # SPEC: <name>

                ## Status
                Draft / In Review / Approved / Superseded
                Version: v1
                Supersedes: <none, or tasks/<name>/SPEC.md vN>
                Owner: <human name>
                Last updated: <date>

                ## Intent
                Why this exists, what problem it solves, for whom. One or two paragraphs, not a restatement of the acceptance criteria.

                ## Background and context
                Relevant prior art, related systems, why this is being done now rather than earlier or later.

                ## Acceptance criteria
                Write each criterion using the EARS pattern that fits: an invariant, event, state, unwanted condition, or optional feature followed by the system response. Combine a state and event only when both matter. Not "handles errors gracefully," that's not testable. Number each one (AC-1, AC-2, ...) so PLAN.md's user stories can name which criteria they cover. Example:

                - AC-1: While the queue is non-empty, when a worker polls, the dispatcher shall return exactly one unclaimed task.
                - AC-2: While no tasks are available, when a worker polls, the dispatcher shall return an empty result within 200ms, not block.

                - AC-3:

                ## Explicit non-goals
                What this deliberately does not do. Required, not optional, this is what the admission rubric checks a diff against for invented scope.

                -

                ## Assumptions
                What's being taken as given. Worth stating explicitly, because if one of these is wrong, the spec is wrong, not the implementation.

                -

                ## Constraints
                Technical, regulatory, timeline, or resourcing limits that shape the acceptance criteria above.

                -

                ## Open questions
                Ambiguity that has to be resolved by a human before PLAN.md gets written, not silently assumed by whoever implements this. If this section is empty, that's worth a second look, not a sign everything's clear.

                -

                ## Risk-relevant context
                - Touches:
                - Does not touch:

                ## Risk tier
                <0 / 1 / 2, from the risk-tiering skill>

                ## Review

                An agent drafts this document. The human approves or rejects it at the spec-review workflow gate with `wctl task decide <task> spec-review`, optionally using `--reject --feedback 'changes needed'`.
            STORY_LOG.md: |
                # Story evidence

                Append DONE US-### only after the story's checks pass.
        version: 1

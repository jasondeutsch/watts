kind: Workflow
schema_version: 1
name: research
spec:
  version: 1
  steps:
    - name: research
      use:
        kind: Agent
        name: research
---
kind: Agent
schema_version: 1
name: research
spec:
  runtime_agent: build
  outputs:
    - REPORT.md
  runtime: pi
  identity: watts-researcher
  provider: openrouter
  model: deepseek/deepseek-v4-flash
  prompt: Investigate the question described in this task's files. Inspect the project and write your findings, supporting evidence and unresolved questions to {task}/REPORT.md.
  sandbox:
    mode: local

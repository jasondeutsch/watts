<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f5f5;
    color: #333;
  }
  .container {
    text-align: center;
    padding: 16px;
    max-width: 400px;
    width: 100%;
  }
  h1 {
    font-size: 1.8rem;
    margin: 0 0 16px 0;
  }
  #status {
    font-size: 1.2rem;
    margin-bottom: 16px;
    min-height: 1.5em;
    font-weight: 600;
  }
  #status.win { color: #2e7d32; }
  #status.draw { color: #e65100; }
  #status.error { color: #c62828; }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    background: #333;
    border: 2px solid #333;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    font-weight: bold;
    background: #fff;
    border: none;
    cursor: pointer;
    transition: background 0.15s;
    padding: 0;
    color: #333;
    -webkit-tap-highlight-color: transparent;
  }
  .cell:hover:not(.taken):not(.game-over) { background: #e3f2fd; }
  .cell:active:not(.taken):not(.game-over) { background: #bbdefb; }
  .cell.taken { cursor: default; }
  .cell.game-over { cursor: default; }
  .cell.x { color: #1565c0; }
  .cell.o { color: #c62828; }
  #reset-btn {
    font-size: 1rem;
    padding: 10px 24px;
    background: #1565c0;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.15s;
  }
  #reset-btn:hover { background: #0d47a1; }
  #reset-btn:focus { outline: 2px solid #90caf9; }
  @media (max-width: 400px) {
    .cell { font-size: 2rem; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Tic-Tac-Toe</h1>
  <div id="status">Loading...</div>
  <div class="board" id="board">
    <button class="cell" data-index="0"></button>
    <button class="cell" data-index="1"></button>
    <button class="cell" data-index="2"></button>
    <button class="cell" data-index="3"></button>
    <button class="cell" data-index="4"></button>
    <button class="cell" data-index="5"></button>
    <button class="cell" data-index="6"></button>
    <button class="cell" data-index="7"></button>
    <button class="cell" data-index="8"></button>
  </div>
  <button id="reset-btn">Reset Game</button>
</div>
<script>
  const API_BASE = '';
  const cells = document.querySelectorAll('.cell');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('reset-btn');
  let currentGameOver = false;

  async function fetchState() {
    try {
      const res = await fetch(API_BASE + '/state');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const state = await res.json();
      renderBoard(state);
    } catch (err) {
      statusEl.textContent = 'Failed to load game state.';
      statusEl.className = 'error';
    }
  }

  function renderBoard(state) {
    for (let i = 0; i < 9; i++) {
      const cell = cells[i];
      const row = Math.floor(i / 3);
      const col = i % 3;
      const mark = (state.board[row][col]).trim();
      cell.textContent = mark || '';
      cell.className = 'cell';
      if (mark) {
        cell.classList.add('taken');
        cell.classList.add(mark === 'X' ? 'x' : 'o');
      }
      if (state.gameOver) cell.classList.add('game-over');
    }

    currentGameOver = state.gameOver;

    if (state.winner) {
      statusEl.textContent = 'Player ' + state.winner + ' wins!';
      statusEl.className = 'win';
    } else if (state.gameOver) {
      statusEl.textContent = 'The game is a draw.';
      statusEl.className = 'draw';
    } else {
      statusEl.textContent = "Player " + state.currentPlayer + "'s turn";
      statusEl.className = '';
    }
  }

  async function makeMove(index) {
    if (currentGameOver) return;
    try {
      const res = await fetch(API_BASE + '/move', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cell: index })
      });
      const state = await res.json();
      renderBoard(state);
      if (!res.ok) {
        if (state.error) {
          statusEl.textContent = state.error;
        } else {
          statusEl.textContent = 'Invalid move';
        }
        statusEl.className = 'error';
      }
    } catch (err) {
      statusEl.textContent = 'Network error.';
      statusEl.className = 'error';
    }
  }

  async function resetGame() {
    try {
      const res = await fetch(API_BASE + '/reset', { method: 'POST' });
      const state = await res.json();
      renderBoard(state);
    } catch (err) {
      statusEl.textContent = 'Failed to reset game.';
      statusEl.className = 'error';
    }
  }

  cells.forEach(function(cell) {
    cell.addEventListener('click', function() {
      var index = parseInt(cell.dataset.index);
      makeMove(index);
    });
  });

  resetBtn.addEventListener('click', resetGame);

  // Load initial state
  fetchState();
</script>
</body>
</html>

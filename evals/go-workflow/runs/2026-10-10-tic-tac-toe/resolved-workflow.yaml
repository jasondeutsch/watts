kind: Workflow
schema_version: 1
name: 2026-10-10-tic-tac-toe-eval
spec:
  version: 1
  capture_baseline: true
  steps:
    - name: specification
      use:
        kind: Agent
        name: specification
    - name: spec-review
      use:
        kind: Procedure
        name: spec-review
      transitions:
        approved: planning
        rejected: specification
    - name: planning
      use:
        kind: Agent
        name: planning
    - name: plan-review
      use:
        kind: Procedure
        name: plan-review
      transitions:
        approved: build
        rejected: planning
    - name: build
      use:
        kind: Agent
        name: build
    - name: lint
      use:
        kind: Procedure
        name: lint
    - name: review
      use:
        kind: Agent
        name: review
      on_failure: build
---
kind: Secret
schema_version: 1
name: credentials-specification
spec:
  env:
    OPENROUTER_API_KEY: OPENROUTER_API_KEY
---
kind: Agent
schema_version: 1
name: specification
spec:
  runtime_agent: build
  inputs:
    - SPEC.md
  outputs:
    - SPEC.md
  checks:
    - script: check-spec
  runtime: pi
  identity: watts-agent
  provider: openrouter
  model: deepseek/deepseek-v4-flash
  prompt: Read the human's request in {task}/SPEC.md; it may be rough notes rather than a complete draft. Use the spec-template skill to investigate the project and draft or refine {task}/SPEC.md. Preserve existing human intent, constraints, and substantive content; never overwrite it with a blank template. Record unresolved questions rather than inventing requirements. Incorporate previous review feedback. Write the updated SPEC.md to disk. Do not implement code or approve documents. The project root is the current working directory containing watts.yaml. Implement application source, tests, modules, and other project files in the project root and its normal source directories. The task directory holds workflow documents, story logs, review artifacts, and execution evidence only; do not create application code or a separate application module inside it. Quality gates run from the project root, not with a task-directory working directory.
  sandbox:
    mode: local
  auth:
    secret:
      name: credentials-specification
      key: OPENROUTER_API_KEY
    env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  api: openai-completions
  thinking: low
---
kind: Procedure
schema_version: 1
name: spec-review
spec:
  inputs:
    - SPEC.md
  execution:
    type: approval
---
kind: Secret
schema_version: 1
name: credentials-planning
spec:
  env:
    OPENROUTER_API_KEY: OPENROUTER_API_KEY
---
kind: Agent
schema_version: 1
name: planning
spec:
  runtime_agent: build
  inputs:
    - SPEC.md
  outputs:
    - PLAN.md
  checks:
    - script: check-plan
  runtime: pi
  identity: watts-agent
  provider: openrouter
  model: deepseek/deepseek-v4-flash
  prompt: The preceding workflow gate approved the specification. Read {task}/SPEC.md. Use the plan-template skill to write {task}/PLAN.md with real quality gates and sequenced stories. Incorporate previous review feedback. Do not implement code or approve documents. The project root is the current working directory containing watts.yaml. Implement application source, tests, modules, and other project files in the project root and its normal source directories. The task directory holds workflow documents, story logs, review artifacts, and execution evidence only; do not create application code or a separate application module inside it. Quality gates run from the project root, not with a task-directory working directory. Include `bash .watts/packages/go-generalist/f3e80902dcdbad2520bb679945135271090e3f72df99467ff306fed2d1f0491f/scripts/lint.sh` in PLAN.md quality gates. Lint findings must be fixed without weakening the lint configuration.
  sandbox:
    mode: local
  auth:
    secret:
      name: credentials-planning
      key: OPENROUTER_API_KEY
    env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  api: openai-completions
  thinking: low
---
kind: Procedure
schema_version: 1
name: plan-review
spec:
  inputs:
    - SPEC.md
    - PLAN.md
  execution:
    type: approval
---
kind: Secret
schema_version: 1
name: credentials-build
spec:
  env:
    OPENROUTER_API_KEY: OPENROUTER_API_KEY
---
kind: Agent
schema_version: 1
name: build
spec:
  runtime_agent: build
  inputs:
    - SPEC.md
    - PLAN.md
  outputs:
    - STORY_LOG.md
  pre_checks:
    - script: preflight
  checks:
    - script: check-stories
      args:
        - --strict
    - script: gates
    - script: check-rework
  runtime: pi
  identity: watts-agent
  provider: openrouter
  model: deepseek/deepseek-v4-flash
  prompt: /ralph --path ./{task}
  sandbox:
    mode: local
  auth:
    secret:
      name: credentials-build
      key: OPENROUTER_API_KEY
    env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  api: openai-completions
  thinking: low
  skills_dirs:
    - .watts/packages/go-generalist/f3e80902dcdbad2520bb679945135271090e3f72df99467ff306fed2d1f0491f/skills
  mcps:
    - gopls
  mcp_servers:
    gopls:
      command: gopls
      args:
        - mcp
      cwd: .
---
kind: Procedure
schema_version: 1
name: lint
spec:
  timeout_seconds: 360
  execution:
    type: command
    command: bash .watts/packages/go-generalist/f3e80902dcdbad2520bb679945135271090e3f72df99467ff306fed2d1f0491f/scripts/lint.sh
---
kind: Secret
schema_version: 1
name: credentials-review
spec:
  env:
    OPENROUTER_API_KEY: OPENROUTER_API_KEY
---
kind: Agent
schema_version: 1
name: review
spec:
  runtime_agent: review
  inputs:
    - SPEC.md
    - PLAN.md
    - STORY_LOG.md
  outputs:
    - review/VERDICT.md
  pre_checks:
    - script: pre-review
  checks:
    - script: check-verdict
      args:
        - --require-pass
  runtime: pi
  identity: watts-reviewer
  provider: openrouter
  model: deepseek/deepseek-v4-flash
  prompt: /ralph --path ./{task}/review
  sandbox:
    mode: local
  auth:
    secret:
      name: credentials-review
      key: OPENROUTER_API_KEY
    env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  api: openai-completions
  thinking: low

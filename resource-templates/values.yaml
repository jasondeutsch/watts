agents:
    builder:
        config_ref: agent-defaults
        container:
            command:
                - node
                - /opt/watts/launcher.mjs
            cpus: 2
            files:
                launcher.json: '{"outputs":null}'
            image: watts/pi-ralph:0.1.0
            memory_mb: 4096
            network: bridge
            workspace: write
        identity: watts-builder
        inputs:
            - SPEC.md
        prompt: Read /runtime/task/SPEC.md and implement the requested change in the project root.
config_maps:
    agent-defaults:
        data:
            api: openai-completions
            auth:
                env: OPENROUTER_API_KEY
                secret:
                    key: api-key
                    name: model-credentials
            base_url: https://openrouter.ai/api/v1
            model: deepseek/deepseek-v4-flash
            provider: openrouter
            thinking: medium
procedures:
    lint:
        container:
            command:
                - go
                - vet
                - ./...
            image: watts/coder-golang:0.1.0
            network: bridge
            result: exit-code
            workspace: read-only
        environment:
            GOCACHE: /runtime/go-cache
            GOMODCACHE: /runtime/go-mod
        execution:
            type: container
secrets:
    model-credentials:
        env:
            api-key: OPENROUTER_API_KEY
workflow:
    name: example
    spec:
        steps:
            - name: build
              use:
                kind: Agent
                name: builder
            - name: lint
              use:
                kind: Procedure
                name: lint
        templates:
            PLAN.md: |
                # Task plan

                Implementation approach and checks belong here.
            SPEC.md: |
                # Task specification

                Describe the requested change, constraints, and acceptance criteria.
        version: 1
